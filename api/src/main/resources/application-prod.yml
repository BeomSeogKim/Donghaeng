# PROD zone: VPS behind the Cloudflare proxy, managed Postgres
# (../../notes/infra-zones.md). Credentials come from the deploy platform's
# native store, never from this file.
donghaeng:
  # Required marker. Its absence is how a no-profile start fails fast — see
  # com.donghaeng.config.RequiredProfileMarker.
  profile: prod

server:
  # Cloudflare and Caddy both sit in front, so the request the app sees is plain
  # HTTP on a private address. Without this, every absolute URL the app builds
  # says `http://` — and the security record requires an exact-match OAuth
  # `redirect_uri`, which is precisely where a wrong scheme breaks.
  #
  # NATIVE rather than FRAMEWORK: NATIVE installs Tomcat's RemoteIpValve, which
  # honours X-Forwarded-* only from its `internal-proxies` ranges, while
  # FRAMEWORK's ForwardedHeaderFilter has no notion of a trusted proxy at all.
  # It is a narrowing, not a guarantee: Tomcat's defaults include 100.64.0.0/10,
  # which is Tailscale's CGNAT range, and the VPS firewall admits exactly
  # Cloudflare and Tailscale — so the one class of direct-to-origin request the
  # perimeter permits is inside the trusted set. Pinning `internal-proxies` to
  # the real proxy address is a deploy-stop item; no record fixes it yet.
  forward-headers-strategy: native

spring:
  jpa:
    hibernate:
      # Raised from the base's `none`, and this is the file where it matters
      # most. No migration runs during a deploy: the founder applies the DDL by
      # hand from the migration files, while the suite builds its own schema
      # from them (notes/2026-08-09-decision-schema-ownership.md). Nothing
      # compares those two schemas — the first symptom of a divergence would
      # otherwise be a runtime error on a query, in front of a user. `validate`
      # turns that into a refusal to start, at deploy time, where someone is
      # already watching.
      #
      # Honest about its reach: it checks the tables, columns and types
      # Hibernate MAPS — not indexes, most constraints, defaults, triggers, or
      # anything no entity refers to. A missing index starts cleanly and is a
      # plausible way for the aggregation queries to be slow rather than wrong.
      # The unmapped schema stays the founder's to verify.
      ddl-auto: validate
  datasource:
    hikari:
      # A guess, not a measured number: one app instance, a 2-vCPU managed
      # Postgres, and small-instance throughput peaks at a small pool. The load
      # that will actually test it is the first RSVP burst after invitations go
      # out; tracked as an open question rather than sized by pretending.
      maximum-pool-size: 5
  flyway:
    # Both restated from the base, and for one reason: this file is what gets
    # read during a deploy review, and "deliberately absent" is not the same
    # thing as visibly off to the person reading it.
    #
    # `enabled: false` is the whole of the schema-ownership decision
    # (notes/2026-08-09-decision-schema-ownership.md) — no migration runs during
    # a deploy, the founder applies the DDL by hand from the same migration
    # files. Losing it silently is the failure this restatement exists to make
    # visible. `clean-disabled` is the one whose loss is unrecoverable, and it
    # stays pinned even with Flyway off: it has to already be right on the day
    # anything turns Flyway on.
    #
    # Neither is load-bearing on its own: the base sets both, a sweep in
    # ProfileConfigurationTest forbids any profile from loosening either, and
    # SchemaOwnershipGuard refuses to start on the RESOLVED value — which is the
    # only check an environment variable cannot walk past.
    enabled: false
    clean-disabled: true

logging:
  level:
    # Restated from the base, where they are set for every environment. Read the
    # comment there for why they exist; here they are simply not reopened.
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.orm.jdbc.extract: 'OFF'
# Deliberately absent: springdoc stays disabled by inheriting the base — no
# machine-readable introspection surface is internet-reachable
# (notes/2026-08-08-decision-scaffold-secrets-and-surface.md). Nothing here
# re-enables it.
