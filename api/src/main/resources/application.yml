# Shared base for the two profiles, application-{dev,prod}.yml.
#
# Starting with no profile is an ERROR, not a restrictive start: `donghaeng.profile`
# is required and only the profile files define it, so the context fails with an
# instruction naming the fix (com.donghaeng.config.MissingProfileFailureAnalyzer).
# The reason is that the visible symptom comes far too late — a mistyped profile
# has connected to whatever DATABASE_URL points at and served traffic under the
# wrong settings long before the missing forwarded-header handling breaks a login.
#
# What this file holds is the setting whose WRONG value is unsafe, so that a
# profile has to opt out of safety deliberately. It is not true that profiles
# only loosen: springdoc, forwarded headers and log level loosen here, the
# connection-pool cap tightens, and the session cookie flags landing in #5 will
# have to tighten (Boot defaults `server.servlet.session.cookie.secure` to false).
#
# Split: yml carries shape, the environment carries secrets. No credential —
# DB, OAuth, or otherwise — appears in any profile file, and a test enforces it.
# Profile selection: SPRING_PROFILES_ACTIVE (see README, Development).
server:
  port: 8080
  error:
    # What the servlet container's error page may publish. Boot already defaults
    # all three to the safe value, and they are pinned anyway for the same reason
    # `log-request-details` below is: a default is not a decision, and the
    # environment outranks every file in the jar
    # (notes/2026-08-09-decision-schema-ownership.md), so
    # `SERVER_ERROR_INCLUDE_MESSAGE=always` in a deploy platform would publish
    # exception messages with the whole suite green. RealConfigurationBootTest
    # asserts the RESOLVED values, which is the only place that reversal is
    # visible.
    #
    # Since ProblemErrorController replaced BasicErrorController these three
    # decide nothing at runtime — it never reads them. That is deliberate
    # redundancy, not a leftover: the pin has to outlive anyone deleting that
    # class without knowing what it was for.
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: donghaeng-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # The app never writes DDL, in any environment. `none` is the right value
      # for the base because the base describes an environment that has declared
      # nothing about its database; dev and prod raise it to `validate`, and the
      # comment there says why.
      ddl-auto: none
  flyway:
    # Flyway runs in the TESTS ONLY (notes/2026-08-09-decision-schema-ownership.md).
    # Every DDL statement against a real database is applied by the founder, by
    # hand, from these same migration files — there is no second copy of the DDL.
    # A migration that runs at startup is irreversible, unattended work at the
    # moment an environment is least observed, and `clean-disabled` only guards
    # one catastrophic verb; it says nothing about a DROP COLUMN that looked
    # right in review.
    #
    # It lives in the base, off, because that is the value whose opposite is
    # unsafe: an environment has to opt in deliberately. The suite opts in
    # through a system property set in build.gradle.kts; nothing else does, and
    # ProfileConfigurationTest fails if a profile file tries.
    enabled: false
    # Safest default, inherited by every profile: a clean that runs anywhere but
    # a throwaway database is data loss, not a reset. Kept even with Flyway off —
    # it is the setting that has to already be right on the day it is turned on.
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
    # When true, Spring logs request headers — including Cookie, i.e. the session
    # token. Boot defaults it false; stated because "masked in logs" is a rule
    # here, not a preference (notes/2026-07-30-decision-network-security.md).
    log-request-details: false

logging:
  level:
    # These three belong in the BASE, not in prod. They have no safe default and
    # they are what print 하객 names and phone numbers: `bind` logs the parameters
    # sent, `extract` logs the values read back — same data, opposite direction —
    # and neither is covered by `show-sql: false`, which is a different code path.
    # Pinned so that raising the root level to DEBUG during an incident, on any
    # machine, cannot turn them on by accident.
    # The quotes are load-bearing: unquoted OFF is the YAML 1.1 boolean false.
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.orm.jdbc.extract: 'OFF'

springdoc:
  api-docs:
    # Off by default so a deploy never publishes the endpoint/DTO map; the seam
    # work re-enables it only where the document is actually generated.
    enabled: false
