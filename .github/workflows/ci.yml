# CI exists to make a merged `main` deployable without worry — not to prove the
# code compiles. So the pipeline is allowed to be slow where slowness buys
# deploy confidence: `prod-boot` boots the committed prod configuration, and
# `docker` boots the packaged image itself and interrogates what it serves.
#
# notes/2026-08-08-decision-build-workflow.md ("a red check is never merged").
#
# Schema ownership (who applies DDL, and therefore what these jobs must set up
# before the app starts) is open and tracked on issue #3.
name: CI

# The default token scope is a repository setting nobody is watching, and every
# job below runs third-party code — Gradle plugins, npm lifecycle scripts —
# inside the job. Pinned here for the same reason the restrictive settings live
# in `application.yml`: opting out has to be deliberate and visible in review.
permissions:
  contents: read

on:
  # Push is restricted to `main` because `pull_request` already covers every
  # branch that matters; unfiltered, each PR push ran the whole pipeline twice
  # under two different concurrency groups.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is here for exactly one of its causes: when a base branch merges,
    # GitHub retargets its children onto `main` and fires `edited` — not
    # `synchronize` — so without this a retargeted PR shows a green merge button
    # with ZERO checks, which reads like "passed" at a glance. It cost a red
    # `main` on 2026-08-20 (#138). It also fires on title and body edits, which
    # re-runs the pipeline for nothing; `cancel-in-progress` above bounds that,
    # and at this repo's PR volume it is cheaper than the failure it prevents.
    #
    # Listing `types` at all replaces the default, so the default three are
    # spelled out here — dropping one would silently stop checking PRs.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on `main`: this pipeline exists to certify `main`, and two quick
  # merges would cancel the first run. A cancelled run is not green.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No repository secret is used anywhere in this file. The only credentials are
# the throwaway values in the `docker` job below, for a Postgres that lives and
# dies with the job.

jobs:
  api:
    name: api · ktlint + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The committed wrapper jar and the pinned distribution have already
      # disagreed once (notes/2026-08-08-decision-scaffold-secrets-and-surface.md).
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers needs no service container: ubuntu-latest runners ship a
      # working Docker daemon, and the tests start their own Postgres.
      - run: ./gradlew ktlintCheck build --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: api/build/reports/tests/test
          if-no-files-found: ignore

      # The seam, handed to the `seam` job below. `build` writes this file as a
      # side effect of the test that asserts what is in it
      # (notes/2026-08-19-decision-openapi-artifact.md), so it is a real
      # description of what this commit's API serves rather than a document
      # anyone maintains.
      #
      # No `if: always()` and `if-no-files-found: error`, both deliberately: a
      # failed build's document is stale or absent, and either would let `seam`
      # certify the frontend's types against nothing at all.
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-document
          path: api/build/openapi.json
          if-no-files-found: error

  prod-boot:
    # The same tests the `api` job already ran, isolated so the checks list
    # carries a distinct "the committed dev and prod configuration actually
    # boots" signal. It costs one extra compile; a red here means do not deploy,
    # which is worth more than the minute.
    name: prod-boot · real dev/prod config boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same justification as in the `api` job: this job runs the wrapper too,
      # so it gets the same check.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Gradle fails the task when a filter matches nothing, so a stale filter
      # is loud rather than vacuously green.
      - run: ./gradlew test --tests 'com.donghaeng.*ProfileBootTest' --no-daemon

  hooks:
    name: hooks · guards + AGENTS.md budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # These shell suites guard rules the repo cannot otherwise enforce: what may
    # be merged, what may reach a database, what a closing trailer may name, and
    # how large the rule files may get. All were hand-run until a review found
    # seven bypasses in the db guard at once — a control nothing exercises is a
    # control nobody knows the shape of.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash .claude/hooks/merge-gate.test.sh
      - run: bash .claude/hooks/db-guard.test.sh
      - run: bash .claude/hooks/closes-guard.test.sh

      # Not a suite — the check itself. The budget was written into AGENTS.md
      # and run by nobody, which is the same shape as the 908-line file it was
      # written to prevent.
      - name: AGENTS.md is within budget
        run: bash .claude/hooks/agents-budget.sh

      # A passing suite says the hook works, not that anything runs it. Deleting
      # four lines from settings.json leaves every check green and both guards
      # absent. The Kotlin side has this assertion (spring.factories); the shell
      # side did not.
      - name: The hooks are still wired
        run: |
          set -euo pipefail
          for hook in merge-gate db-guard closes-guard; do
            jq -e --arg h "$hook" '
              [.hooks.PreToolUse[]
               | select(.matcher == "Bash")
               | .hooks[].command
               | select(test($h))] | length > 0
            ' .claude/settings.json > /dev/null \
              || { echo "::error::$hook.sh is not registered as a Bash PreToolUse hook"; exit 1; }
            echo "wired: $hook.sh"
          done

  web:
    name: web · typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # package.json pins engines.node to ^22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # Biome (lint + format) chained with check:design, which enforces the one
      # design-system rule nothing else can: the @theme bridge in src/index.css
      # clears Tailwind's namespaces so a hardcoded colour or radius fails to
      # compile, but v4 has no duration namespace to clear and arbitrary-value
      # syntax (`bg-[#ff0000]`) walks past all of them
      # (notes/2026-08-07-design-system.md, issue #45). A linter not in CI is a
      # suggestion, which is why this line and not just the package.json script.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # `build` chains check:tokens, which is the only guard on the token bridge.
      - run: npm run build

  seam:
    name: seam · generated types match the API document
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that reads both trees, which is why it is its own job and not
    # a step of `web`: `web` would then wait on the whole backend build to learn
    # that a component does not compile.
    needs: api
    # `web/src/lib/api-types.gen.ts` is committed, so `web` typechecks against
    # the seam without a JVM and a rename shows up in the diff a reviewer reads.
    # The price of committing generated output is that it can go stale, and this
    # job is the whole payment: it regenerates from the document THIS commit's
    # API actually serves and refuses any difference.
    #
    # A backend rename therefore lands as two red checks, in this order — `seam`
    # says the committed types no longer describe the API, and once they are
    # regenerated `web` says the code still asks for the old field.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Into api/build/ so `npm run generate:api-types` is the same command here
      # and on a laptop. A generator invoked two different ways is a generator
      # whose CI result says nothing about what a developer will get.
      - uses: actions/download-artifact@v4
        with:
          name: openapi-document
          path: api/build

      - run: npm ci
        working-directory: web

      - run: npm run generate:api-types
        working-directory: web

      - name: The committed types still describe the API
        run: |
          set -euo pipefail
          types=web/src/lib/api-types.gen.ts
          # `git diff` is blind to a file git does not track, so without this the
          # check passes loudest exactly when the types have been deleted.
          git ls-files --error-unmatch "$types" > /dev/null 2>&1 || {
            echo "::error::$types is not committed. It has to be, or nothing" \
                 "typechecks against the API without a JVM — and this check has" \
                 "nothing to compare."
            exit 1
          }
          git diff --exit-code -- "$types" || {
            echo "::error::$types is stale. The API document changed and the" \
                 "committed types did not. Run: cd api && ./gradlew openapi &&" \
                 "cd ../web && npm run generate:api-types — then commit the" \
                 "result and fix whatever stops compiling."
            exit 1
          }

  docker:
    name: docker · image builds, boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: donghaeng
          POSTGRES_USER: donghaeng_ci
          POSTGRES_PASSWORD: donghaeng_ci_throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U donghaeng_ci -d donghaeng"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: donghaeng-api:ci
          # Default-on SLSA provenance attaches an attestation to the image.
          # Nothing consumes it here — the image is loaded, probed and thrown
          # away — and it becomes a real question the moment #56 pushes to a
          # registry, where it would arrive as a default nobody chose.
          provenance: false
        env:
          # A SECOND, separate mechanism, and the one that actually publishes.
          # `provenance:` governs the image; the build summary governs the run:
          # it exports a `.dockerbuild` record carrying
          # `environment.github_event_payload` — the entire event, PR body and
          # all — into the job log and uploads it as a run artifact kept for 90
          # days. Turning off provenance alone leaves that untouched; this was
          # verified by reading the log of the run that did exactly that.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
          # And a THIRD: the action prints the buildx metadata file into the job
          # log under `##[group]Metadata`, provenance included. Killing the
          # upload left this behind. How much it exposes depends on the event —
          # `synchronize` carries a diff-sized payload, `opened` carried the
          # entire PR body — which is why one clean-looking run is not evidence.
          BUILDX_METADATA_PROVENANCE: disabled
          # Without this the build stage re-downloads the pinned Gradle
          # distribution and every dependency on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Issue #55, and it comes due exactly now. Flyway is disabled in every
      # environment (notes/2026-08-09-decision-schema-ownership.md), so the image
      # brings no schema with it — and from #37 onward there are @Entity classes,
      # which `ddl-auto: validate` compares against the database at startup. An
      # empty Postgres therefore stops the app before it binds a port, and this job
      # would go red for a reason that has nothing to do with what it certifies.
      #
      # This step is the CI stand-in for the founder typing the DDL by hand, and it
      # is deliberately shaped like that act rather than like a migration run:
      # every V*.sql applied in version order, each inside its own transaction
      # (`--single-transaction`), with `ON_ERROR_STOP` so a half-applied file is a
      # failed job rather than a schema nobody looked at. Flyway is never invoked,
      # so no `flyway_schema_history` appears — which keeps the "the packaged image
      # still refuses to write DDL" step below meeting the guard rather than
      # Flyway's non-empty-schema complaint.
      #
      # The password travels as PGPASSWORD and never inside the connection string.
      # This value is a throwaway that lives and dies with the job, so nothing is
      # at risk either way — the SHAPE is the point. "A secret never travels inside
      # a connection string" (notes/2026-08-08-decision-scaffold-secrets-and-surface.md)
      # exists because HikariCP prints the whole jdbcUrl on its failure path, and
      # the same is true of psql in a job log. A file that argues that sixty lines
      # below, in its own voice, does not get to write the counter-example.
      # ProfileConfigurationTest's credential-URI sweep walks this file.
      - name: Apply the migration files by hand, as a real database gets them
        env:
          PGPASSWORD: donghaeng_ci_throwaway
        run: |
          set -euo pipefail
          for migration in $(ls api/src/main/resources/db/migration/V*.sql | sort -V); do
            echo "applying $migration"
            docker run --rm --network host -v "$PWD:/repo" -e PGPASSWORD postgres:16-alpine \
              psql -h 127.0.0.1 -p 5432 -U donghaeng_ci -d donghaeng \
              --single-transaction -v ON_ERROR_STOP=1 -f "/repo/$migration"
          done

      # --network host so the container reaches the service container's published
      # port, and so its own 8080 is reachable from the runner. The credentials
      # repeat the service block's on purpose — they are throwaway literals, and
      # a level of indirection would only hide which value is being used.
      #
      # TLS to Postgres is deliberately not asserted here: this connection is
      # loopback inside one runner, so `sslmode=verify-full` has nothing to
      # verify. Asserting it needs a real prod environment and belongs to the
      # deploy stop.
      - name: Run the image against Postgres
        run: |
          docker run -d --name donghaeng-api --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DATABASE_URL='jdbc:postgresql://127.0.0.1:5432/donghaeng' \
            -e DB_USERNAME='donghaeng_ci' \
            -e DB_PASSWORD='donghaeng_ci_throwaway' \
            donghaeng-api:ci

      # `docker logs ... | grep -q` is deliberately avoided: `grep -q` exits on
      # the first match and closes the pipe, `docker logs` then dies of SIGPIPE
      # with 141, and `pipefail` reports the successful match as a failure — so a
      # matched line spins to the deadline and reports a timeout on an app that
      # started fine. Capturing to a file removes the pipe entirely.
      - name: Wait for startup
        run: |
          set -euo pipefail
          await_log() {
            pattern=$1
            budget=$2
            deadline=$(( SECONDS + budget ))
            while true; do
              docker logs donghaeng-api > /tmp/api.log 2>&1
              if grep -qF "$pattern" /tmp/api.log; then
                echo "logged: $pattern"
                return 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' donghaeng-api)" != "true" ]; then
                echo "::error::the container exited before logging '$pattern'"
                return 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::no '$pattern' within ${budget}s"
                return 1
              fi
              sleep 2
            done
          }

          # Hikari opens the pool on the first getConnection(), so this line is
          # proof the app reached Postgres — not merely that it parsed a
          # datasource URL. Flyway no longer runs here at all
          # (notes/2026-08-09-decision-schema-ownership.md), so what opens that
          # first connection is Hibernate's database-metadata lookup while the
          # EntityManagerFactory is built — verified against this image, not
          # assumed. Asserted in its own right because the day that stops being
          # true this goes red instead of quietly certifying an app that never
          # talked to the database.
          #
          # Since #37 this line asserts something stronger than it used to. There
          # are @Entity classes now and `ddl-auto: validate` is on, so reaching
          # this point means the shipped mappings matched the hand-applied schema
          # from the step above — the one comparison nothing else in the pipeline
          # makes, since the suite validates against a schema Flyway built for it.
          await_log 'HikariPool-1 - Start completed.' 120

          # Boot prints `Started DonghaengApplicationKt` — Kotlin names the file
          # facade, not the class — so this matches as a prefix.
          await_log 'Started DonghaengApplication' 120

      # The startup line already implies the TCP accept, so a socket connect adds
      # nothing: together they net out to "a JVM opened a port". A broken
      # DispatcherServlet, a filter chain throwing on every request, or
      # ProblemDetail wiring that never took would all pass that.
      #
      # So: assert the real artifact answers a real HTTP request with Spring's
      # RFC 9457 problem document (`spring.mvc.problemdetails.enabled: true` is
      # committed), and assert the introspection surface is OFF on that same
      # artifact. The image bakes application-dev.yml, whose whole
      # security-relevant content is `springdoc.api-docs.enabled: true`, and
      # nothing else anywhere observes what port 8080 actually serves under the
      # prod profile. A negative assertion on the artifact is the only kind that
      # survives a profile-precedence mistake
      # (notes/2026-08-08-decision-scaffold-secrets-and-surface.md).
      - name: The image serves, and publishes nothing
        run: |
          set -euo pipefail
          probe() {
            curl -sS --max-time 10 --retry 10 --retry-connrefused --retry-delay 2 \
              -o /tmp/body -w '%{http_code} %{content_type}' \
              "http://127.0.0.1:8080$1"
          }

          expect_404() {
            path=$1
            result=$(probe "$path")
            echo "$path -> $result"
            case "$result" in
              '404 '*) ;;
              *) echo "::error::$path answered '$result', expected 404"; exit 1 ;;
            esac
          }

          # Serving at all: an unmapped path comes back as a problem document,
          # which only a working servlet stack can produce.
          result=$(probe /__ci_unmapped_path)
          echo "/__ci_unmapped_path -> $result"
          case "$result" in
            '404 application/problem+json'*) ;;
            *) echo "::error::unmapped path answered '$result', expected a 404 problem document"; exit 1 ;;
          esac
          # Parsed, not grepped. `grep '"status":404'` would depend on Jackson
          # emitting whitespace-free JSON, and go red on a healthy app the day
          # anything pretty-prints (indent-output, or a ProblemDetail
          # customisation in #4) — a check failing for a reason unrelated to
          # what it claims to test, which is the whole failure family this job
          # has already been bitten by once. jq is preinstalled on the runner.
          jq -e '.status == 404 and (.title | type) == "string"' /tmp/body > /dev/null

          # Publishing nothing.
          expect_404 /v3/api-docs
          expect_404 /swagger-ui/index.html
          expect_404 /actuator/health

          # `/error` is a mapped path, not an unmapped one: `@RequestMapping`
          # matches DispatcherType.REQUEST too, so anyone can GET it. With no
          # dispatch attributes there is no error to report, and a 500 here would
          # be a fabricated incident an anonymous client can generate at will —
          # against the 401/404/429 spike alerting the security record keeps, and
          # unrateable, since the standing rule is per-wedding and per-link-token
          # and this path has neither. Asserted on the artifact because the
          # reachability comes from Spring MVC's mapping, not from our code.
          expect_404 /error

      # The container's own error page — the one producer no Kotlin class in this
      # repo can reach. Tomcat's ErrorReportValve defaults to rendering the
      # exception, a partial stack trace and its own version string; Boot hardens
      # it ONLY when `server.error.include-stacktrace` resolves to `never`, so
      # without TomcatErrorPageHardening the guarantee hangs off one environment
      # variable. A negative assertion on the shipped artifact is the only kind
      # that survives that variable being set in the deploy platform.
      #
      # A request target the connector rejects outright is used deliberately: it
      # is answered before the request reaches the servlet context, so neither of
      # our producers runs and only the valve can respond. curl will not send it
      # — it is not a valid URL — which is why this is a raw socket.
      - name: The container error page publishes nothing either
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket, sys

          request = b"GET /a|b HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n"
          with socket.create_connection(("127.0.0.1", 8080), timeout=10) as sock:
              sock.sendall(request)
              received = b""
              while True:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  received += chunk

          response = received.decode("utf-8", "replace")
          print(response.splitlines()[0] if response else "<empty response>")

          published = [
              marker
              for marker in ("Apache Tomcat", "Exception Report", "java.lang.", "jakarta.servlet")
              if marker in response
          ]
          if published:
              print(f"::error::the container error page published {published}")
              sys.exit(1)
          print("container error page: clean")
          PY

      # SchemaOwnershipGuard refuses to start an environment that could write DDL
      # — and it disables itself whenever `spring-boot-starter-test` is on the
      # classpath, because the suite legitimately runs Flyway. So the day a test
      # dependency reaches the runtime classpath, the guard is silently absent
      # from the shipped jar and every other check stays green (issue #60).
      #
      # This job is the only place that regression is observable. `prod-boot`
      # cannot see it: a Gradle `Test` task carries the test classpath, so it
      # boots with the guard already off by design. Here the artifact is the real
      # one, so asking it to do the forbidden thing and watching it say no is a
      # negative assertion on what actually ships.
      #
      # THE MATCHED STRINGS ARE A CONTRACT. A container that exits for an
      # unrelated reason — no database, a port clash, a mistyped variable name —
      # would satisfy an exit-code check while proving nothing, so the assertion
      # is on text instead. Both source files say so where the strings are
      # defined.
      #
      # Three patterns are matched, and they are NOT three independent proofs.
      # `APPLICATION FAILED TO START` is printed only by Boot's
      # LoggingFailureAnalysisReporter — that is, only when some FailureAnalyzer
      # produced an analysis — so it and the "applied by hand" sentence are two
      # readings of one fact: SchemaOwnershipFailureAnalyzer is wired. Only the
      # violation sentence is the guard's own text. The banner is kept anyway
      # because the "applied by hand" line pins WHICH analyzer answered, which
      # the banner alone does not.
      #
      # The coupling that follows is deliberate and worth knowing before you trip
      # over it: deleting the FailureAnalyzer is a defensible simplification —
      # the guard still refuses, the app still will not start — but it turns this
      # step red with "refused, but not as the guard". The analyzer and this step
      # change together.
      #
      # The unit test (SchemaOwnershipGuardTest) deliberately does NOT assert
      # these sentences; it builds its own message. Do not "fix" that gap: if the
      # suite pinned them, a reword would edit the test in the same breath and be
      # rubber-stamped. Leaving them unpinned there means a reword fails here, in
      # the one check whose whole subject is a contract with something outside
      # the suite. Minutes late beats seconds late and silently agreed with.
      - name: The packaged image still refuses to write DDL
        run: |
          set -euo pipefail

          # No `await_log` here, and no waiting idiom at all: the refusal happens
          # in an EnvironmentPostProcessor, before a single bean, so the
          # container simply exits and `docker wait` is the synchronisation. The
          # timeout is the interesting half — if the guard is gone the app boots
          # normally and never exits, which is reported as "kept running instead
          # of refusing" rather than hanging to the job deadline.
          #
          # Same --network host and same credentials as the boot above, plus a
          # free port, so that a guard-less jar would START — reaching Postgres,
          # binding a connector, running on — and the timeout branch reports the
          # regression it is named for instead of the app dying of an unreachable
          # database and being written off as "refused, but not as the guard".
          # None of it is exercised while the guard works: it fires before a port
          # is bound or a connection opened.
          #
          # That "would START" is still true, and it is worth saying why now that
          # the schema step above exists. A guard-less jar with
          # SPRING_FLYWAY_ENABLED=true would meet a schema that has every table and
          # no `flyway_schema_history` — Flyway's "Found non-empty schema without
          # schema history table" — and exit. So a missing guard surfaces through
          # the "refused, but not as the guard" branch rather than the timeout one.
          # Still red, still a detector; only the branch that fires changes, and
          # this paragraph is what stops that reading as a bug. It is also why the
          # schema step applies the files with `psql` rather than with Flyway: a
          # history table would make that jar start cleanly and this check green.
          refuses() {
            label=$1 env_name=$2 env_value=$3 violation=$4
            name=donghaeng-api-guard

            # `set -u` catches a missing 4th argument; it says nothing about an
            # empty one, and `grep -qF ""` matches any log at all. That failure
            # would be a green step asserting nothing — this file's recurring
            # failure, and the exact thing issue #60 is about.
            [ -n "$violation" ] || { echo "::error::$label: no violation pattern given"; return 1; }

            docker rm -f "$name" > /dev/null 2>&1 || true
            docker run -d --name "$name" --network host \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SERVER_PORT=8099 \
              -e DATABASE_URL='jdbc:postgresql://127.0.0.1:5432/donghaeng' \
              -e DB_USERNAME='donghaeng_ci' \
              -e DB_PASSWORD='donghaeng_ci_throwaway' \
              -e "$env_name=$env_value" \
              donghaeng-api:ci > /dev/null

            # `timeout` reports its own timeout as 124 and passes anything else
            # through, and the two must not share a branch: a daemon hiccup or a
            # renamed container would otherwise print the most alarming line in
            # this workflow — "the guard is not in the jar" — about something
            # that was never observed. stderr is kept for the same reason; the
            # `No such container` line is the evidence that tells them apart.
            status=0
            timeout 120 docker wait "$name" > /tmp/guard-exit || status=$?
            docker logs "$name" > /tmp/guard.log 2>&1 || true
            docker rm -f "$name" > /dev/null 2>&1 || true

            # Every failure branch below dumps the whole boot log, and that is
            # safe only because DATABASE_URL carries no credential: HikariCP
            # prints the entire jdbcUrl on its failure path, which is precisely
            # why the username and password are separate keys
            # (notes/2026-08-08-decision-scaffold-secrets-and-surface.md). Put a
            # password back in the URL and this step publishes it into the job
            # log the first time a boot fails for an unrelated reason.
            if [ "$status" -eq 124 ]; then
              echo "::error::$label: the image kept running instead of refusing — the guard is not in the jar"
              cat /tmp/guard.log
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::$label: could not observe the container (docker wait exited $status) — this says nothing about the guard"
              return 1
            fi
            if [ "$(cat /tmp/guard-exit)" = "0" ]; then
              echo "::error::$label: the image exited 0; a refusal is a failed start"
              cat /tmp/guard.log
              return 1
            fi

            # It refused. Now: did IT refuse, or did something else break?
            while IFS= read -r pattern; do
              if ! grep -qF "$pattern" /tmp/guard.log; then
                echo "::error::$label: the image refused, but not as the guard — no '$pattern' in its log"
                cat /tmp/guard.log
                return 1
              fi
            done <<EOF
          APPLICATION FAILED TO START
          $violation
          The schema of a real database is applied by hand
          EOF

            echo "refused as designed ($label) — this failed boot is the assertion, not an incident"
          }

          refuses 'flyway re-enabled' \
            SPRING_FLYWAY_ENABLED true \
            '`spring.flyway.enabled` resolved to `true`, and this application never runs a migration outside its own tests.'

          # The second door, and it is not a synonym that loses:
          # HibernateProperties.determineDdlAuto reads the raw
          # `hibernate.hbm2ddl.auto` BEFORE Boot's `ddl-auto` alias, so an
          # environment can set it and win outright. Costs one more failed boot,
          # which ends in the EnvironmentPostProcessor and so is a few seconds.
          refuses 'raw hibernate ddl property' \
            SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO create-drop \
            '`spring.jpa.properties.hibernate.hbm2ddl.auto` resolved to `create-drop`, and this application never writes DDL.'

      - name: Container log
        if: always()
        run: docker logs donghaeng-api 2>&1 || true
