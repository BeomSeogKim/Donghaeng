server:
  port: 8080

spring:
  application:
    name: donghaeng-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    # Off by default so a deploy never publishes the endpoint/DTO map; the seam
    # work re-enables it only where the document is actually generated.
    enabled: false
